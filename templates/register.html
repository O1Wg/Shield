{% extends "base.html" %}

{% block title %}Register - Shield Notes{% endblock %}

{% block content %}
<h2>Create an Account</h2>
<p>Register to start storing your notes securely.</p>

<!-- Registration Form with basic HTML5 input validation -->
<form method="POST" action="/register">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required minlength="3" maxlength="50" placeholder="Choose a username (3-50 chars)">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6" maxlength="100" placeholder="Choose a strong password (min 6 chars)">

    <button type="submit" class="btn btn-primary">Register</button>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
</form>

<p style="margin-top: 20px;">
    Already have an account? <a href="/login">Login here</a>
</p>
{% endblock %}
