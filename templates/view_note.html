{% extends "base.html" %}

{% block title %}{{ note.title }} - Shield Notes{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="/notes" class="btn btn-primary" style="background-color: #475569;">&larr; Back to Notes</a>
</div>

<!-- Note displayed safely using Jinja2 auto-escaping -->
<h2>{{ note.title }}</h2>
<p style="color: #64748b; font-size: 0.9rem;">Created at: {{ note.created_at }}</p>

<div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 20px; white-space: pre-wrap; word-break: break-word; margin: 20px 0;">
{{ note.content }}
</div>

<div style="display: flex; gap: 10px;">
    <a href="/notes/{{ note.note_id }}/edit" class="btn" style="background-color: #f59e0b; color: white;">Edit Note</a>
    <form method="POST" action="/notes/{{ note.note_id }}/delete" style="margin: 0;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-danger">Delete Note</button>
    </form>
</div>
{% endblock %}
